<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2330" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="circle"><circle cx="256" cy="256" r="256" /></clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="512" height="512" fill="url(#g2)" />
    <circle cx="256" cy="256" r="150" fill="url(#g1)" opacity="0.12" />
    <g filter="url(#glow)">
      <text x="256" y="330" text-anchor="middle" font-family="&#39;Segoe UI&#39;,Arial,sans-serif" font-size="300" font-weight="800" fill="url(#g1)">G</text>
    </g>
    <circle cx="372" cy="352" r="20" fill="#22d3ee" filter="url(#glow)" />
  </g>
</svg>